# Render Blueprint for TaskFlow
#
# Deploys two resources on Render's free tier. Postgres lives on Neon, not
# on Render - Render's free Postgres expires 30 days after creation.
#   - taskflow-backend:  Node/Express API (free web service)
#   - taskflow-frontend: Vite/React static site (free, always-on, no sleep)
#
# Set DATABASE_URL on the backend in the Render Dashboard to the Neon
# connection string (direct host, not the -pooler host - db:init applies
# schema.sql as one multi-statement query, which transaction-mode PgBouncer
# rejects). sync: false keeps later blueprint applies from overwriting it.
#
# Free web services sleep after ~15 min of inactivity. Since Render Cron Jobs
# are NOT free (min $1/mo), the keep-alive ping for taskflow-backend is
# handled by a GitHub Actions scheduled workflow instead:
# .github/workflows/keepalive.yml
#
# Free web services do not support preDeployCommand, so db:init runs in
# startCommand before npm start (initSchema.ts is idempotent).
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
# Docs:   https://render.com/docs/blueprint-spec

services:
  # --- Backend API ---------------------------------------------------------
  - type: web
    name: taskflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: app/backend
    # The backend is TypeScript as of the Phase 3 cutover, so the build has
    # to compile it - `npm start` runs dist/main.js, and `db:init` runs
    # dist/database/initSchema.js. `npm ci` (not --omit=dev) is required:
    # typescript is a devDependency and the build needs it.
    buildCommand: npm ci && npm run build
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      # Neon connection string, set once in the Render Dashboard. Direct
      # host (ep-….neon.tech), not the pooled host (ep-…-pooler.neon.tech).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: taskflow-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: LOG_LEVEL
        value: info
      # Locks /metrics behind an X-Metrics-Key header (see healthRoutes.js).
      # Grab the generated value from the Render dashboard's env vars tab to
      # scrape metrics yourself, e.g.:
      #   curl -H "X-Metrics-Key: <value>" https://<backend-url>/metrics
      - key: METRICS_KEY
        generateValue: true

  # --- Frontend static site --------------------------------------------------
  # Static sites are free on Render; the `plan` field does not apply (omit it).
  - type: web
    name: taskflow-frontend
    runtime: static
    rootDir: app/frontend
    buildCommand: npm ci && npm run build
    # Relative to rootDir (app/frontend), NOT the repo root - "app/frontend/dist"
    # made Render look for app/frontend/app/frontend/dist, which never exists.
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: taskflow-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Client-side routing (react-router) - serve index.html for all paths
      - type: rewrite
        source: /*
        destination: /index.html
