# Render Blueprint for TaskFlow
#
# Deploys three resources on Render's free tier:
#   - taskflow-db:       Render Postgres (free plan)
#   - taskflow-backend:  Node/Express API (free web service)
#   - taskflow-frontend: Vite/React static site (free, always-on, no sleep)
#
# Free web services sleep after ~15 min of inactivity. Since Render Cron Jobs
# are NOT free (min $1/mo), the keep-alive ping for taskflow-backend is
# handled by a GitHub Actions scheduled workflow instead:
# .github/workflows/keepalive.yml
#
# Free web services do not support preDeployCommand, so db:init runs in
# startCommand before npm start (init-schema.js is idempotent).
#
# NOTE: Render's free Postgres plan is deleted 30 days after creation. For a
# real "production" deployment, upgrade taskflow-db's plan (see docs/RENDER_DEPLOY.md).
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
# Docs:   https://render.com/docs/blueprint-spec

databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free
    region: oregon

services:
  # --- Backend API ---------------------------------------------------------
  - type: web
    name: taskflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: app/backend
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: taskflow-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: LOG_LEVEL
        value: info

  # --- Frontend static site --------------------------------------------------
  - type: web
    name: taskflow-frontend
    runtime: static
    plan: free
    rootDir: app/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: taskflow-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Client-side routing (react-router) - serve index.html for all paths
      - type: rewrite
        source: /*
        destination: /index.html
