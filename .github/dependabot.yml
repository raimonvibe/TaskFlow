# Forced Dependabot check: 2026-11-11T10:54:48Z
# Dependabot configuration for dependency updates and security alerts.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      # vitest and its plugins need the same version, so bump them together
      # (majors included, so a split PR can't fail on peer dependencies).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      # React refuses to run when react and react-dom versions differ, so
      # separate PRs for them can never go green on their own.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vitest and its plugins need the same version, so bump them together
      # (majors included, so a split PR can't fail on peer dependencies).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "/load-testing"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "load-testing"]

  - package-ecosystem: "docker"
    directories: ["/app/backend", "/app/frontend"]
    schedule:
      interval: "weekly"
      day: "saturday"
    # Node majors move by hand with .nvmrc, CI and render.yaml, and only to
    # even (LTS) releases. Dependabot would otherwise offer odd ones like 23.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
