<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Home screen icon (iOS "Add to Home Screen") + PWA manifest (Android/Chrome) -->
    <link rel="apple-touch-icon" href="/social.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1f3a" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow - DevOps Learning Project" />

    <!--
      Social share preview (Open Graph).

      social-share.jpg is 1200x630 (the canonical 1.91:1 card) and ~118KB.
      The size is the point, not just tidiness: WhatsApp silently drops the
      preview image above roughly 300KB, and the previous social-share.png
      was ~894KB served, so links pasted into WhatsApp showed text only.
      JPEG rather than PNG because the artwork is a photographic gradient -
      palette-quantizing that to keep PNG under the ceiling would band it.
      Keep any replacement under ~250KB and re-check on WhatsApp.

      og:image must stay an absolute URL, and it hardcodes the Render
      hostname. Moving to a custom domain means updating this and og:url, or
      previews break with no visible error.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaskFlow" />
    <meta property="og:title" content="TaskFlow - Task Management" />
    <meta property="og:description" content="TaskFlow - DevOps Learning Project" />
    <meta property="og:image" content="https://taskflow-frontend-a4e8.onrender.com/social-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <!-- Width/height let a crawler lay the card out before the image
         finishes downloading, so the preview appears on the first share
         rather than only after something has warmed the cache. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TaskFlow - Learn DevOps by Building Real Apps" />
    <meta property="og:url" content="https://taskflow-frontend-a4e8.onrender.com/" />

    <!-- Social share preview (Twitter/X card) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TaskFlow - Task Management" />
    <meta name="twitter:description" content="TaskFlow - DevOps Learning Project" />
    <meta name="twitter:image" content="https://taskflow-frontend-a4e8.onrender.com/social-share.jpg" />
    <meta name="twitter:image:alt" content="TaskFlow - Learn DevOps by Building Real Apps" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>TaskFlow - Task Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
